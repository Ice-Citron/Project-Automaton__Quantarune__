defaults:
  - model: flow_matching
  - data: default
  - training: default
  - eval: sim
  - _self_

seed: 42
device: cuda
output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
wandb:
  enable: true
  project: aic-flow-policy
  entity: null
  name: null
  group: null
