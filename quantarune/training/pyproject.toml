[build-system]
requires = ["setuptools>=71.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantarune_training"
version = "0.1.0"
description = "Training pipeline for flow matching policies for AIC cable insertion"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.17",
    "einops>=0.8",
    "timm>=1.0",
    "safetensors",
    "huggingface-hub",
    "lerobot==0.4.3",
    "opencv-python-headless",
    "numpy",
    "pyarrow",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
pi05 = ["openpi"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["quantarune_training*"]
