[workspace]
name = "aic-training"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
packaging = ">=24.2,<26.0"
setuptools = ">=71.0.0,<81.0.0"

[pypi-dependencies]
av = "*"
einops = ">=0.8"
huggingface-hub = { version = "==0.35.3", extras = ["hf-transfer", "cli"] }
hydra-core = ">=1.3"
lerobot = "==0.4.3"
numpy = "*"
omegaconf = ">=2.3"
opencv-python-headless = "<4.13.0"
pyarrow = "*"
pyyaml = ">=6,<7"
safetensors = ">=0.5"
timm = ">=1.0"
torch = ">=2.0"
torchvision = ">=0.15"
wandb = ">=0.17"
